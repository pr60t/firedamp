# Firedamp Default Security Policy
# Zero-tolerance policy for multi-tenant data exfiltration and isolation failure.

name: default_zero_leak
version: v1
description: Strict zero-tolerance policy for RAG data exfiltration & tenant boundary violation.

thresholds:
  fail_on_direct_leak: true
  fail_on_context_leak: true
  fail_on_cve_breach: true
  fail_on_auth_bypass: true
  fail_on_write_poisoning: true
  max_firedamp_index: 0.0
  allowed_status_codes:
    - 401
    - 403
    - 404
  ignored_channels: []
  enforce_clean_baseline: true

exemptions: []

