name: Firedamp Simulation Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation-smoke:
    name: CLI Dry-Run Simulation Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Firedamp & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Simulated Dry-Run Smoke Check (Markdown)
        run: |
          echo "### [SIMULATION DRY-RUN] Non-live CLI smoke output" >> "$GITHUB_STEP_SUMMARY"
          python cli.py scan \
            --target openwebui \
            --cpu-only \
            --output /tmp/firedamp-sim-report.md \
            --format markdown \
            --canaries 4 \
            --dry-run
          cat /tmp/firedamp-sim-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run Simulated Dry-Run Smoke Check (SARIF Generation Only)
        run: |
          python cli.py scan \
            --target openwebui \
            --cpu-only \
            --output /tmp/firedamp-sim-results.sarif \
            --format sarif \
            --canaries 4 \
            --fail-on-leak \
            --dry-run
          python -c "import json; data = json.load(open('/tmp/firedamp-sim-results.sarif')); assert data['version'] == '2.1.0'"
